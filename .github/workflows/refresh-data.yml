name: Refresh dashboard data

on:
  schedule:
    - cron: "0 22 * * 1-5"  # weekdays, after US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data and export dashboard JSON
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'SellsideResearchEngine/1.0 (github.com/DogInfantry/sellside-research-engine)' }}
        run: |
          AS_OF=$(date -u +%F)
          python main_v2.py fetch-all --as-of "$AS_OF"
          python export_dashboard_data.py --as-of "$AS_OF" --skip-fetch
          node -e "JSON.parse(require('fs').readFileSync('dashboard_data.json','utf8'))"

      - name: Commit if changed (push triggers Vercel deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json
          git diff --cached --quiet && echo "No data change" && exit 0
          git commit -m "data: refresh dashboard $(date -u +%F)"
          git push
